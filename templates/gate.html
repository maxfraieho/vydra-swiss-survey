<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .gate-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .input-field {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 16px;
      outline: none;
    }
    .input-field:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      padding: 10px 14px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0369a1;
    }
    .error-msg {
      color: #f87171;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="gate-card">
    <form class="gate-form" method="post" action="/api/auth">
      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
      <input type="password" name="key" class="input-field" autofocus placeholder="Пароль">
      <button type="submit" class="submit-btn">Увійти</button>
    </form>
  </div>
</body>
</html>
