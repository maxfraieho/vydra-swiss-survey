<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astryx Swiss Survey Console</title>
    <base href="./" />
    <script type="module" crossorigin src="./assets/index-B4xFDc9e.js" data-cfasync="false"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CMW6w4Hu.css">
  </head>
  <body>
    <div id="root"></div>
    <script data-cfasync="false">
      window.__vydraErrors = [];
      window.addEventListener('error', function (e) {
        window.__vydraErrors.push('Error: ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && e.reason.stack ? e.reason.stack : e.reason;
        window.__vydraErrors.push('UnhandledRejection: ' + reason);
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var pre = document.createElement('pre');
          pre.style.cssText = 'color:#f87171;background:#0f172a;padding:16px;white-space:pre-wrap;font-size:12px;';
          pre.textContent = 'Vydra diagnostics: root did not mount.\n' +
            (window.__vydraErrors.length ? window.__vydraErrors.join('\n') : 'No window errors captured.');
          document.body.appendChild(pre);
        }
      }, 3000);
    </script>
  </body>
</html>
